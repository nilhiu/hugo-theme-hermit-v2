{{/* Apply the saved palette before first paint to avoid a flash. */}}
<script>
(function () {
  var themes = ['light', 'dark'];
  var id = '{{ .Site.Params.defaultTheme | default "light" }}';
  try {
    var saved = localStorage.getItem('theme');
    if (saved && themes.indexOf(saved) !== -1) id = saved;
  } catch (e) {}
  document.documentElement.dataset.theme = id;
})();
</script>
{{- if and .IsHome .Site.Params.mascot }}
<link rel="preload" as="font" type="font/woff2" href="{{ "fonts/sanae-braille.woff2" | relURL }}" crossorigin>
{{- end }}
